<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickTick</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb;font-size:13px}
*{box-sizing:border-box}body{margin:0;background:#f5f7fb}button,input{font:inherit}button{cursor:pointer}
.panel{height:100vh;display:flex;flex-direction:column;background:#f5f7fb}
.head{height:42px;flex:none;background:#fff;border-bottom:1px solid #e3e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:#172554}
.logo{width:16px;height:16px;border-radius:4px;background:#16a34a;color:white;text-align:center;font-size:12px;line-height:16px}
#close{border:0;background:transparent;color:#64748b;font-size:21px}
.add{display:flex;gap:6px;padding:10px 10px 6px}.add input{min-width:0;flex:1;border:1px solid #d7deea;background:#fff;border-radius:8px;padding:9px}.add button{border:0;background:#15803d;color:white;font-weight:700;border-radius:8px;padding:0 12px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 10px 8px}
.nav button{border:1px solid #dbe2ee;background:#fff;color:#334155;border-radius:7px;padding:6px 9px;font-size:11px;font-weight:700;white-space:nowrap}
.nav button:hover{background:#f0fdf4;border-color:#86efac}
.nav .date{font-size:11px;font-weight:750;color:#334155;text-align:center}
.nav .today[hidden]{display:none}
.nav .today{display:block;margin:3px auto 0;border:0;background:none;color:#15803d;padding:0;font-size:10px}
.list{padding:0 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow:auto}
.item{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid #e3e8f0;border-left:3px solid #16a34a;border-radius:9px;padding:9px}
.item.overdue{border-left-color:#dc2626}.item.soon{border-left-color:#f59e0b}.item.pending{border-left-color:#9333ea;background:#fcf8ff}.item.done{opacity:.72}
.item input{margin-top:2px;accent-color:#16a34a}.body{flex:1;min-width:0}.title{overflow-wrap:anywhere;font-weight:650}.done .title{text-decoration:line-through;color:#718096}
.meta{font-size:11px;color:#64748b;margin-top:3px}.del{border:0;background:none;color:#94a3b8;font-size:18px;line-height:1;padding:0 2px}.del:hover{color:#dc2626}
.actions{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;align-items:center}
.mini{border:1px solid #dbe2ee;background:#fff;color:#475569;border-radius:5px;padding:3px 5px;font-size:10px;white-space:nowrap}
.moved{font-size:10px;color:#6b21a8;font-weight:650}
.empty{padding:20px 8px;text-align:center;color:#718096}
.foot{border-top:1px solid #e3e8f0;background:#fff;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#64748b}.foot a{color:#15803d;text-decoration:none;font-weight:700}
</style>
</head>
<body><main class="panel">
<header class="head"><div class="brand"><span class="logo">✓</span>QuickTick</div><button id="close" title="Close" aria-label="Close">×</button></header>
<form class="add" id="add"><input id="title" maxlength="120" placeholder="Add an action item..." aria-label="New action item" autocomplete="off"><button type="submit">+ Add</button></form>
<div class="nav"><button type="button" id="prev" aria-label="Previous day">‹ Previous</button><div><div class="date" id="date" aria-live="polite"></div><button type="button" class="today" id="goToday" hidden>Back to today</button></div><button type="button" id="next" aria-label="Next day">Next ›</button></div>
<section class="list" id="list"></section>
<footer class="foot"><span id="count">QuickTick · synced with your dashboard</span><a href="dashboard.html" target="_blank">Full dashboard ↗</a></footer>
</main><script src="newtab-checklist.js"></script></body></html>
