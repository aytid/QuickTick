<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QuickTick</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb;font-size:13px}
*{box-sizing:border-box}body{margin:0;background:#f5f7fb}button,input{font:inherit}button{cursor:pointer}
.panel{height:100vh;display:flex;flex-direction:column;background:#f5f7fb}
.head{height:42px;flex:none;background:#fff;border-bottom:1px solid #e3e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px;color:#172554}
.logo{width:16px;height:16px;border-radius:4px;background:#16a34a;color:white;text-align:center;font-size:12px;line-height:16px}
#close{border:0;background:transparent;color:#64748b;font-size:21px}
.add{display:flex;gap:6px;padding:10px}.add input{min-width:0;flex:1;border:1px solid #d7deea;background:#fff;border-radius:8px;padding:9px}.add button{border:0;background:#15803d;color:white;font-weight:700;border-radius:8px;padding:0 12px}
.list{padding:0 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1;min-height:0;overflow:auto}
.item{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid #e3e8f0;border-left:3px solid #16a34a;border-radius:9px;padding:9px}
.item input{margin-top:2px;accent-color:#16a34a}.title{flex:1;overflow-wrap:anywhere;font-weight:650}.done .title{text-decoration:line-through;color:#718096}
.meta{font-size:11px;color:#64748b;margin-top:3px}.del{border:0;background:none;color:#94a3b8;font-size:18px;line-height:1;padding:0 2px}
.empty{padding:20px 8px;text-align:center;color:#718096}
.foot{border-top:1px solid #e3e8f0;background:#fff;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:#64748b}.foot a{color:#15803d;text-decoration:none;font-weight:700}
</style>
</head>
<body><main class="panel">
<header class="head"><div class="brand"><span class="logo">✓</span>QuickTick</div><button id="close" title="Close">×</button></header>
<form class="add" id="add"><input id="title" maxlength="120" placeholder="Add an action item..." autocomplete="off"><button type="submit">+ Add</button></form>
<section class="list" id="list"></section>
<footer class="foot"><span id="count">QuickTick · synced with your dashboard</span><a href="dashboard.html" target="_blank">Full dashboard ↗</a></footer>
</main><script src="newtab-checklist.js"></script></body></html>
